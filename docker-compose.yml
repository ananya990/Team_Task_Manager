version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: taskmanager_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taskmanager
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - taskmanager_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager_backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/taskmanager
      JWT_SECRET: supersecretjwtkey_change_in_production_32chars
      JWT_REFRESH_SECRET: superrefreshjwtkey_change_in_production_32chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      BCRYPT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    ports:
      - '5000:5000'
    networks:
      - taskmanager_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmanager_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    ports:
      - '3000:3000'
    networks:
      - taskmanager_net

volumes:
  mongo_data:

networks:
  taskmanager_net:
    driver: bridge